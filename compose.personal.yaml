name: ${PROJECT_NAME}
services:
  frontend:
    environment:
      XDG_CONFIG_HOME: /home/${USERNAME}/.config
      XDG_CACHE_HOME: /home/${USERNAME}/.cache
      GIT_CONFIG_GLOBAL: /home/${USERNAME}/.config/dotfiles/git/config
    volumes:
      - ${DOTFILES_HOST}:/home/${USERNAME}/.config/dotfiles:ro
      - ${DOTFILES_HOST}/nvim:/home/${USERNAME}/.config/nvim:ro
      - ${HOME}/.local/state:/home/${USERNAME}/.local/state
      - nvim_share:/home/${USERNAME}/.local/share/nvim
  backend:
    environment:
      XDG_CONFIG_HOME: /home/${USERNAME}/.config
      XDG_CACHE_HOME: /home/${USERNAME}/.cache
      GIT_CONFIG_GLOBAL: /home/${USERNAME}/.config/dotfiles/git/config
    volumes:
      - ${DOTFILES_HOST}:/home/${USERNAME}/.config/dotfiles:ro
      - ${DOTFILES_HOST}/nvim:/home/${USERNAME}/.config/nvim:ro
      - ${HOME}/.local/state:/home/${USERNAME}/.local/state
      - nvim_share:/home/${USERNAME}/.local/share/nvim
volumes:
  nvim_share:
    name: ${PROJECT_NAME}_nvim_share

