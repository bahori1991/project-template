name: ${PROJECT_NAME}
services:
  base:
    build:
      context: .
      dockerfile: base.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        USERNAME: ${USERNAME}
        EZA_VERSION: ${EZA_VERSION}
        NVIM_VERSION: ${NVIM_VERSION}
        TREE_SITTER_CLI_VERSION: ${TREE_SITTER_CLI_VERSION}
      labels:
        dev.sample.build-input-hash: ${DEV_SAMPLE_BUILD_HASH_BASE}
    image: dev:base
    profiles:
      - build-only
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        DEV_BASE_IMAGE: ${DEV_BASE_IMAGE}
        USERNAME: ${USERNAME}
      labels:
        dev.sample.build-input-hash: ${DEV_SAMPLE_BUILD_HASH_FRONTEND}
    userns_mode: keep-id
    user: "${UID}:${GID}"
    init: true
    stdin_open: true
    tty: true
    working_dir: /app
    env_file: .env
    environment:
      CONTAINER_NAME: frontend
      NODE_ENV: development
      TERM: xterm-256color
      XDG_CONFIG_HOME: /home/${USERNAME}/.config
      XDG_CACHE_HOME: /home/${USERNAME}/.cache
    ports:
      - "3000:3000"
    volumes:
      - ${FRONTEND_HOST}:/app
      - ${DOTFILES_HOST}:/home/${USERNAME}/.config/dotfiles:ro
      - ${HOME}/.local/state:/home/${USERNAME}/.local/state
      - ${HOME}/.local/share/nvim:/home/${USERNAME}/.local/share/nvim
      - mason_share:/home/${USERNAME}/.local/share/nvim/mason
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        DEV_BASE_IMAGE: ${DEV_BASE_IMAGE}
        USERNAME: ${USERNAME}
      labels:
        dev.sample.build-input-hash: ${DEV_SAMPLE_BUILD_HASH_BACKEND}
    userns_mode: keep-id
    user: "${UID}:${GID}"
    init: true
    stdin_open: true
    tty: true
    working_dir: /app
    env_file: .env
    environment:
      CONTAINER_NAME: backend
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      TERM: xterm-256color
      ConnectionStrings__PostgreSql: "Host=db;Port=5432;Database=db;Username=user;Password=password"
      XDG_CONFIG_HOME: /home/${USERNAME}/.config
      XDG_CACHE_HOME: /home/${USERNAME}/.cache
    ports:
      - "8080:8080"
    volumes:
      - ${BACKEND_HOST}:/app
      - ${DOTFILES_HOST}:/home/${USERNAME}/.config/dotfiles:ro
      - ${HOME}/.local/state:/home/${USERNAME}/.local/state
      - ${HOME}/.local/share/nvim:/home/${USERNAME}/.local/share/nvim
      - mason_share:/home/${USERNAME}/.local/share/nvim/mason
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - pg_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 30s
      retries: 5
volumes:
  pg_db:
    name: ${PROJECT_NAME}_pg_db
  mason_share:
    name: ${PROJECT_NAME}_mason_share




